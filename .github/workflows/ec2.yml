name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    environment: prod
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the files
        uses: actions/checkout@v7

      - name: Copy files to EC2 Server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOST_DNS }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          TARGET: jomacs

      - name: Deploy to EC2 server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo apt-get -y update
            
            #Install Apache web server for launching the application
            sudo apt-get install -y apache2
            sudo systemctl daemon-reload
            sudo systemctl start apache2
            sudo systemctl enable apache2
            cd jomacs
            
            #Remove existing contents of /var/www/html
            sudo rm -rf /var/www/html/*
           
            # Move new files to /var/www/html/
            sudo mv * /var/www/html/


     
     ##########################################################################################
     # Send Slack Notification #
     ##########################################################################################

    # ✅ Send Slack Notification on Success
      - name: Send Slack Notification (Success)
        if: success()
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          MESSAGE="🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩\n🎉 *EC2 Deployment Successful!* ✅\n\n📋 *Deployment Details:*\n🚀 *Repository:* \`${{ github.repository }}\`\n👤 *Actor:* ${{ github.actor }}\n🔗 *Commit:* <${{ github.event.head_commit.url }}|$(echo ${{ github.sha }} | cut -c1-7)>\n💬 *Message:* ${{ github.event.head_commit.message }}\n🖥️ *Server:* ${{ secrets.HOST_DNS }}\n\n🔗 *Quick Links:*\n📊 *GitHub Actions:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>\n⏰ *Deployed at:* ${TIMESTAMP}\n\n🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩"
          curl -X POST -H 'Content-type: application/json' -d "{\"text\": \"$MESSAGE\"}" ${{ secrets.SLACK_WEBHOOK_URL }}
    
    
      # ❌ Send Slack Notification on Failure
      - name: Send Slack Notification (Failure)
        if: failure()
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          MESSAGE="🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥\n🚨 *EC2 Deployment Failed!* ❌\n\n📋 *Failure Details:*\n💥 *Repository:* \`${{ github.repository }}\`\n👤 *Actor:* ${{ github.actor }}\n🔗 *Commit:* <${{ github.event.head_commit.url }}|$(echo ${{ github.sha }} | cut -c1-7)>\n💬 *Message:* ${{ github.event.head_commit.message }}\n🖥️ *Server:* ${{ secrets.HOST_DNS }}\n\n🔍 *Troubleshooting:*\n📊 *View Logs:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions Workflow>\n⏰ *Failed at:* ${TIMESTAMP}\n⚠️ Please check the deployment logs for detailed error information.\n\n🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥"
          curl -X POST -H 'Content-type: application/json' -d "{\"text\": \"$MESSAGE\"}" ${{ secrets.SLACK_WEBHOOK_URL }}